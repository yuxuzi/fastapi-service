contract = 1
id = "service"
name = "FastAPI service"
description = "A layered FastAPI service with health and readiness, settings, JSON logs, an in-memory example resource, and tests."
version = "1"
kind = "service"
status = "stable"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
questions = ["description", "author", "email", "python_version", "license"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package} tests", "uv run pytest"]
security_posture = "No secrets are needed to run it, and it contacts no service. No authentication is included: add it before exposing the service beyond a trusted network. The generated checks do not test deployment, the Dockerfile, or authentication; production settings refuse wildcard hosts and debug mode, and nothing else is checked."

[dependency_groups]
dev = ["httpx>=0.27", "mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
