contract = 1
id = "service-sql"
name = "FastAPI service with SQL"
description = "The service profile with the example resource stored through SQLAlchemy 2: SQLite by default, tables created at startup, and tests on a temporary SQLite file."
version = "1"
kind = "service"
status = "stable"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
questions = ["description", "author", "email", "python_version", "license"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package} tests", "uv run pytest"]
security_posture = "No secrets are needed by default: the database is a SQLite file created in the working directory. A PostgreSQL DATABASE_URL carries a password, so supply it through the environment. No authentication is included: add it before exposing the service beyond a trusted network. The generated checks use SQLite only and do not test PostgreSQL, deployment, the Dockerfile, or authentication; production settings refuse wildcard hosts and debug mode but accept the default SQLite URL."

[dependency_groups]
dev = ["httpx>=0.27", "mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
